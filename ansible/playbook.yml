# 1re partie : installer Docker avec le Python du système
- hosts: all
  gather_facts: true
  become: true
  roles:
    - docker

# 2e partie : déployer l'application avec le Python qui contient le SDK Docker
- hosts: all
  gather_facts: false
  become: true
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python
    roles:
    - network
    - database
    - app
    - front
    - proxy
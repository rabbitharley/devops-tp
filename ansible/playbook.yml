- hosts: all
  gather_facts: true
  become: true

  tasks:
    # Paquets nécessaires pour ajouter le dépôt Docker
    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3
          - python3-pip
          - python3-venv
        state: present
        update_cache: true

    # Clé GPG officielle de Docker, pour vérifier les paquets téléchargés
    - name: Create the keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    # Dépôt stable de Docker, pour la version de Debian du serveur (fact ansible_distribution_release)
    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_facts['distribution_release'] }} stable"
        state: present
        update_cache: true

    # Installation de Docker
    - name: Install Docker
      apt:
        name: docker-ce
        state: present

    # SDK Docker pour Python, dans un environnement virtuel
    # Il est nécessaire aux modules Ansible docker_container et docker_network
    - name: Install Docker SDK for Python in a virtual environment
      pip:
        name: docker
        virtualenv: /opt/docker_venv
        virtualenv_command: python3 -m venv

    # Docker doit tourner, et démarrer avec le serveur
    - name: Make sure Docker is running
      service:
        name: docker
        state: started
        enabled: true
      tags: docker
